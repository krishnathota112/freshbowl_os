<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2316794a' fill-rule='evenodd' d='M16 3C9.4 3 4 8.2 4 14.6c0 1.3 1.1 2.4 2.4 2.4h19.2c1.3 0 2.4-1.1 2.4-2.4C28 8.2 22.6 3 16 3ZM8.2 9.6a2 2 0 1 0 4 0a2 2 0 1 0-4 0ZM17.05 7.6a1.35 1.35 0 1 0 2.7 0a1.35 1.35 0 1 0-2.7 0ZM21 12.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0ZM13.15 13.4a1.05 1.05 0 1 0 2.1 0a1.05 1.05 0 1 0-2.1 0Z'/%3E%3Cpath fill='%2316794a' d='M12.9 19.1h6.2l-.7 7.3a2.5 2.5 0 0 1-5 0l-.5-7.3Z'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mushroom OS – Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="shared.css" rel="stylesheet">
  <link href="tailwind.local.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script>Auth.requireAuth();</script>
</head>
<body class="bg-background font-sans text-on-background flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
    <div class="h-16 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="home.html" class="w-8 h-8 -ml-1 flex items-center justify-center rounded-full text-on-surface-variant no-underline">
          <span class="material-symbols-outlined" style="font-size:22px;">arrow_back</span>
        </a>
        <span class="text-[18px] font-semibold text-primary">Notifications</span>
      </div>
      <button id="markAllRead" class="text-[11px] font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-full">MARK ALL READ</button>
    </div>
  </header>

  <main class="flex-1 pt-16 pb-20 px-5 page-in md:px-8">
    <div class="flex flex-col gap-4 max-w-lg mx-auto md:max-w-3xl">

      <!-- Summary -->
      <section class="grid grid-cols-3 gap-3 pt-2">
        <div class="bg-surface-container-lowest p-3 rounded-xl shadow-md">
          <p id="countUnread" class="text-[16px] font-bold text-primary md:text-[24px]">0</p>
          <p class="text-[11px] text-on-surface-variant">Unread</p>
        </div>
        <div class="bg-surface-container-lowest p-3 rounded-xl shadow-md">
          <p id="countCritical" class="text-[16px] font-bold text-error md:text-[24px]">0</p>
          <p class="text-[11px] text-on-surface-variant">Critical</p>
        </div>
        <div class="bg-surface-container-lowest p-3 rounded-xl shadow-md">
          <p id="countResolved" class="text-[16px] font-bold text-green-700 md:text-[24px]">0</p>
          <p class="text-[11px] text-on-surface-variant">Resolved</p>
        </div>
      </section>

      <!-- Filters -->
      <section class="flex gap-2">
        <button class="notif-filter px-3 py-1.5 rounded-full text-[11px] font-bold bg-primary text-on-primary" data-filter="all">All</button>
        <button class="notif-filter px-3 py-1.5 rounded-full text-[11px] font-bold bg-surface-container text-on-surface-variant" data-filter="critical">Critical</button>
        <button class="notif-filter px-3 py-1.5 rounded-full text-[11px] font-bold bg-surface-container text-on-surface-variant" data-filter="warning">Warning</button>
        <button class="notif-filter px-3 py-1.5 rounded-full text-[11px] font-bold bg-surface-container text-on-surface-variant" data-filter="resolved">Resolved</button>
      </section>

      <!-- List -->
      <section class="flex flex-col gap-2">
        <span class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase px-1">Activity</span>
        <div id="notifList" class="flex flex-col gap-2"></div>
        <div id="notifEmpty" class="hidden flex-col items-center py-12 text-center gap-3">
          <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center">
            <span class="material-symbols-outlined text-outline" style="font-size:32px;">notifications_off</span>
          </div>
          <p class="text-[14px] font-medium text-on-surface-variant">Nothing in this filter.</p>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav md:hidden">
    <a href="home.html" data-navlink="home.html"><span class="material-symbols-outlined">home</span><span>Home</span></a>
    <a href="workflow.html" data-navlink="workflow.html"><span class="material-symbols-outlined">account_tree</span><span>Workflow</span></a>
    <a href="records.html" data-navlink="records.html"><span class="material-symbols-outlined">history</span><span>Records</span></a>
    <a href="admin_dashboard.html" data-navlink="admin_dashboard.html" data-admin-only><span class="material-symbols-outlined">monitoring</span><span>Admin</span></a>
    <a href="approvals.html" data-navlink="approvals.html"><span class="material-symbols-outlined">fact_check</span><span>Approvals</span></a>
    <a href="profile.html" data-navlink="profile.html"><span class="material-symbols-outlined">person</span><span>Profile</span></a>
  </nav>
  <div class="h-16 md:hidden"></div>
  <script src="app.js"></script>
  <script src="demo.js"></script>
  <script>
    /* Same alert records as admin_dashboard.html's alerts feed, kept as one
       list so the two screens never disagree. Mock data - swap for the
       `alerts` Firestore collection later. */
    const NOTIFICATIONS = [
      { id: 'al_1', severity: 'critical', type: 'Moisture Out Of Range',
        message: 'Moisture 71.4% — Stage 0C, Bunker 2. Above 68–69% target.',
        operator: 'Ramesh', minsAgo: 2, status: 'unread' },
      { id: 'al_2', severity: 'warning', type: 'Heap Rest Overdue',
        message: 'Heap rest overdue — Stage 0A. 12hr rest window exceeded.',
        operator: 'Suresh', minsAgo: 14, status: 'unread' },
      { id: 'al_3', severity: 'resolved', type: 'Stage Approved',
        message: 'Stage 0B approved and signed off.',
        operator: 'Admin', minsAgo: 41, status: 'read' },
    ];

    const TONE = {
      critical: { bar: 'bg-error',              icon: 'warning',      fg: 'text-error',             chip: 'bg-error-container text-on-error-container',            label: 'Critical' },
      warning:  { bar: 'bg-tertiary-container', icon: 'schedule',     fg: 'text-tertiary-container', chip: 'bg-tertiary-fixed text-on-tertiary-fixed-variant',      label: 'Warning'  },
      resolved: { bar: 'bg-outline-variant',    icon: 'check_circle', fg: 'text-outline',           chip: 'bg-green-100 text-green-700',                            label: 'Resolved' },
    };

    const ago = m => m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' hr ago';

    let filter = 'all';

    function render() {
      const list = document.getElementById('notifList');
      const empty = document.getElementById('notifEmpty');
      const rows = NOTIFICATIONS.filter(n =>
        filter === 'all' ? true : filter === 'resolved' ? n.severity === 'resolved' : n.severity === filter);

      list.innerHTML = rows.map(n => {
        const t = TONE[n.severity];
        const unread = n.status === 'unread';
        return `<div class="notif-card bg-surface-container-lowest rounded-xl p-3 flex items-start gap-3 shadow-md border-l-[3px] ${t.bar.replace('bg-', 'border-')} ${unread ? '' : 'opacity-70'}" data-id="${n.id}">
          <span class="material-symbols-outlined ${t.fg}" style="font-size:20px;">${t.icon}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="text-[14px] font-bold text-on-surface">${n.type}</p>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full ${t.chip}">${t.label.toUpperCase()}</span>
              ${unread ? '<span class="w-2 h-2 rounded-full bg-primary pulse-dot"></span>' : ''}
            </div>
            <p class="text-[12px] text-on-surface-variant mt-0.5">${n.message}</p>
            <p class="text-[11px] text-outline mt-1">${n.operator} · ${ago(n.minsAgo)}</p>
          </div>
        </div>`;
      }).join('');

      empty.classList.toggle('hidden', rows.length > 0);
      empty.classList.toggle('flex', rows.length === 0);

      document.getElementById('countUnread').textContent   = NOTIFICATIONS.filter(n => n.status === 'unread').length;
      document.getElementById('countCritical').textContent = NOTIFICATIONS.filter(n => n.severity === 'critical').length;
      document.getElementById('countResolved').textContent = NOTIFICATIONS.filter(n => n.severity === 'resolved').length;
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();

      document.querySelectorAll('.notif-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          filter = btn.getAttribute('data-filter');
          document.querySelectorAll('.notif-filter').forEach(b => {
            const on = b === btn;
            b.classList.toggle('bg-primary', on);
            b.classList.toggle('text-on-primary', on);
            b.classList.toggle('bg-surface-container', !on);
            b.classList.toggle('text-on-surface-variant', !on);
          });
          render();
        });
      });

      document.getElementById('markAllRead').addEventListener('click', () => {
        NOTIFICATIONS.forEach(n => n.status = 'read');
        render();
      });
    });
  </script>
</body>
</html>
