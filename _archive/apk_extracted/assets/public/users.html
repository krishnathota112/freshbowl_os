<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2316794a' fill-rule='evenodd' d='M16 3C9.4 3 4 8.2 4 14.6c0 1.3 1.1 2.4 2.4 2.4h19.2c1.3 0 2.4-1.1 2.4-2.4C28 8.2 22.6 3 16 3ZM8.2 9.6a2 2 0 1 0 4 0a2 2 0 1 0-4 0ZM17.05 7.6a1.35 1.35 0 1 0 2.7 0a1.35 1.35 0 1 0-2.7 0ZM21 12.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0ZM13.15 13.4a1.05 1.05 0 1 0 2.1 0a1.05 1.05 0 1 0-2.1 0Z'/%3E%3Cpath fill='%2316794a' d='M12.9 19.1h6.2l-.7 7.3a2.5 2.5 0 0 1-5 0l-.5-7.3Z'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mushroom OS – Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="shared.css" rel="stylesheet">
  <link href="tailwind.local.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script>Auth.requireAuth();</script>
</head>
<body class="bg-background font-sans text-on-background flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
    <div class="h-16 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="admin_dashboard.html" data-admin-only class="w-8 h-8 -ml-1 flex items-center justify-center rounded-full text-on-surface-variant no-underline">
          <span class="material-symbols-outlined" style="font-size:22px;">arrow_back</span>
        </a>
        <span class="text-[18px] font-semibold text-primary">Users</span>
      </div>
      <span class="flex items-center gap-1 bg-primary-fixed text-on-primary-fixed-variant px-2.5 py-1 rounded-full text-[10px] font-bold">
        <span class="material-symbols-outlined" style="font-size:14px;">shield_person</span> ADMIN ONLY
      </span>
    </div>
  </header>

  <main class="flex-1 pt-16 pb-20 px-5 page-in md:px-8">
    <div class="flex flex-col gap-4 max-w-lg mx-auto md:max-w-3xl">

      <section class="pt-2">
        <h1 class="text-[24px] font-bold text-on-surface">Personnel Directory</h1>
        <p class="text-[12px] text-on-surface-variant mt-0.5" id="userSummary"></p>
      </section>

      <section class="grid grid-cols-2 gap-3">
        <div class="bg-surface-container-lowest p-3 rounded-xl shadow-md">
          <p id="countOperators" class="text-[16px] font-bold text-primary md:text-[24px]">0</p>
          <p class="text-[11px] text-on-surface-variant">Operators</p>
        </div>
        <div class="bg-surface-container-lowest p-3 rounded-xl shadow-md">
          <p id="countAdmins" class="text-[16px] font-bold text-tertiary md:text-[24px]">0</p>
          <p class="text-[11px] text-on-surface-variant">Admins</p>
        </div>
      </section>

      <section class="flex flex-col gap-2">
        <span class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase px-1">All Users</span>
        <div id="userList" class="flex flex-col gap-2 md:grid md:grid-cols-2 md:gap-3"></div>
      </section>

      <p class="text-[11px] text-outline text-center px-4">
        Read-only view. User creation and role changes are handled by an administrator.
      </p>
    </div>
  </main>

  <nav class="bottom-nav md:hidden">
    <a href="home.html" data-navlink="home.html"><span class="material-symbols-outlined">home</span><span>Home</span></a>
    <a href="workflow.html" data-navlink="workflow.html"><span class="material-symbols-outlined">account_tree</span><span>Workflow</span></a>
    <a href="records.html" data-navlink="records.html"><span class="material-symbols-outlined">history</span><span>Records</span></a>
    <a href="admin_dashboard.html" data-admin-only data-navlink="admin_dashboard.html" class="active"><span class="material-symbols-outlined">monitoring</span><span>Admin</span></a>
    <a href="approvals.html" data-navlink="approvals.html"><span class="material-symbols-outlined">fact_check</span><span>Approvals</span></a>
    <a href="profile.html" data-navlink="profile.html"><span class="material-symbols-outlined">person</span><span>Profile</span></a>
  </nav>
  <div class="h-16 md:hidden"></div>
  <script src="app.js"></script>
  <script src="demo.js"></script>
  <script>
    /* Shaped to match the `users` Firestore collection (see firebase/firestore.rules
       and D:\app_new\src\types\index.ts UserProfile): uid, email, displayName,
       role. `shift` and `currentStage` are display-only extras drawn from the
       Workers On Shift list on admin_dashboard.html so the two agree.
       Mock data - swap for a Firestore query later. */
    const USERS = [
      { uid: 'op1',  displayName: 'Ramesh',  email: 'ramesh@freshbowl.in',  role: 'operator', shift: 'Morning A', currentStage: 'Stage 0C · Bunker 2' },
      { uid: 'op2',  displayName: 'Suresh',  email: 'suresh@freshbowl.in',  role: 'operator', shift: 'Morning A', currentStage: 'Stage 0A · Heap Rest' },
      { uid: 'op3',  displayName: 'Mahesh',  email: 'mahesh@freshbowl.in',  role: 'operator', shift: 'Morning A', currentStage: 'Phase 2C · Tunnel Process' },
      { uid: 'op4',  displayName: 'Prasad',  email: 'prasad@freshbowl.in',  role: 'operator', shift: 'Morning A', currentStage: 'Stage 1A · Dry Mix' },
      { uid: 'op5',  displayName: 'Karan',   email: 'karan@freshbowl.in',   role: 'operator', shift: 'Night B',   currentStage: null },
      { uid: 'boss', displayName: 'Mike',    email: 'mike@freshbowl.in',    role: 'admin',    shift: 'Day',       currentStage: null },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const operators = USERS.filter(u => u.role === 'operator');
      const admins    = USERS.filter(u => u.role === 'admin');

      document.getElementById('countOperators').textContent = operators.length;
      document.getElementById('countAdmins').textContent    = admins.length;
      document.getElementById('userSummary').textContent    =
        USERS.length + ' users · ' + USERS.filter(u => u.currentStage).length + ' currently on a stage';

      document.getElementById('userList').innerHTML = USERS.map(u => {
        const isAdmin = u.role === 'admin';
        const chip = isAdmin
          ? 'bg-tertiary-fixed text-on-tertiary-fixed-variant'
          : 'bg-primary-fixed text-on-primary-fixed-variant';
        const active = !!u.currentStage;
        return `<div class="bg-surface-container-lowest rounded-xl p-3 flex items-center gap-3 shadow-md">
          <div class="relative shrink-0">
            <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-[14px] font-bold text-on-secondary-container">
              ${u.displayName.substring(0, 2).toUpperCase()}
            </div>
            <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white ${active ? 'bg-green-600' : 'bg-outline-variant'}"></span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-bold text-on-surface truncate">${u.displayName}</p>
            <p class="text-[12px] text-on-surface-variant truncate">${u.email}</p>
            <p class="text-[11px] text-outline truncate mt-0.5">${u.currentStage || 'Not on shift · ' + u.shift}</p>
          </div>
          <span class="text-[10px] font-bold px-2 py-1 rounded-full shrink-0 ${chip}">${u.role.toUpperCase()}</span>
        </div>`;
      }).join('');
    });
  </script>
</body>
</html>
