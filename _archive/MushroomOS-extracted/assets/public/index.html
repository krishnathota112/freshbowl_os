<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2316794a' fill-rule='evenodd' d='M16 3C9.4 3 4 8.2 4 14.6c0 1.3 1.1 2.4 2.4 2.4h19.2c1.3 0 2.4-1.1 2.4-2.4C28 8.2 22.6 3 16 3ZM8.2 9.6a2 2 0 1 0 4 0a2 2 0 1 0-4 0ZM17.05 7.6a1.35 1.35 0 1 0 2.7 0a1.35 1.35 0 1 0-2.7 0ZM21 12.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0ZM13.15 13.4a1.05 1.05 0 1 0 2.1 0a1.05 1.05 0 1 0-2.1 0Z'/%3E%3Cpath fill='%2316794a' d='M12.9 19.1h6.2l-.7 7.3a2.5 2.5 0 0 1-5 0l-.5-7.3Z'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mushroom OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="shared.css" rel="stylesheet">
  <link href="tailwind.local.css" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    /* No Material icon font on this screen on purpose: it is the first thing
       drawn, and a CDN font that has not arrived yet would render its ligature
       as raw text. The mark and the spinner are both inline SVG/CSS. */
    @keyframes boot-in { from { opacity: 0; transform: translateY(8px) scale(.96); }
                         to   { opacity: 1; transform: none; } }
    @keyframes ring    { to { transform: rotate(360deg); } }
    .boot-mark  { animation: boot-in .5s cubic-bezier(.2,.7,.3,1) both; }
    .boot-text  { animation: boot-in .5s cubic-bezier(.2,.7,.3,1) .12s both; }
    .boot-ring  { animation: ring 1s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark, .boot-text { animation: none; }
      .boot-ring { animation-duration: 2.4s; }
    }
  </style>
</head>
<body class="bg-background font-sans text-on-background min-h-screen flex flex-col items-center px-8">

  <!-- flex-1 wrapper does the centring; mt-auto on the footer would otherwise
       absorb the free space and push everything to the top. -->
  <div class="flex-1 flex flex-col items-center justify-center">

  <div class="boot-mark relative w-28 h-28 flex items-center justify-center">
    <div class="absolute inset-0 rounded-full bg-primary/5 scale-110"></div>
    <div class="relative z-10 w-full h-full rounded-full bg-primary flex items-center justify-center shadow-lg">
      <svg viewBox="0 0 32 32" class="w-14 h-14 text-on-primary" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16 3C9.4 3 4 8.2 4 14.6c0 1.3 1.1 2.4 2.4 2.4h19.2c1.3 0 2.4-1.1 2.4-2.4C28 8.2 22.6 3 16 3ZM8.2 9.6a2 2 0 1 0 4 0a2 2 0 1 0-4 0ZM17.05 7.6a1.35 1.35 0 1 0 2.7 0a1.35 1.35 0 1 0-2.7 0ZM21 12.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0ZM13.15 13.4a1.05 1.05 0 1 0 2.1 0a1.05 1.05 0 1 0-2.1 0Z"/><path d="M12.9 19.1h6.2l-.7 7.3a2.5 2.5 0 0 1-5 0l-.5-7.3Z"/></svg>
    </div>
  </div>

  <div class="boot-text mt-7 text-center">
    <h1 class="text-[28px] font-bold text-on-background tracking-tight">Mushroom OS</h1>
    <p class="text-[13px] font-medium text-secondary mt-1.5">Composting workflow automation</p>
  </div>

  <svg class="boot-ring mt-10 w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" aria-label="Loading">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" opacity=".18"/>
    <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  </div>

  <p class="mb-8 text-[11px] font-bold tracking-widest text-outline uppercase">Freshbowl</p>

  <script>
    // Route once the brand beat has played: straight to Home if a session is
    // already stored, otherwise to sign-in. replace() so Back never lands here.
    (function () {
      // index.html?hold holds the screen open — for screenshots, and for
      // deliberately showing the boot screen during a demo.
      if (new URLSearchParams(location.search).has('hold')) return;
      var session = window.Auth && window.Auth.currentUser();
      var next = session ? window.Auth.landingFor(session.role) : 'login.html';
      var MIN_MS = 1300;
      var start = Date.now();
      function go() { window.location.replace(next); }
      if (document.readyState === 'complete') setTimeout(go, MIN_MS);
      else window.addEventListener('load', function () {
        setTimeout(go, Math.max(0, MIN_MS - (Date.now() - start)));
      });
    })();
  </script>
</body>
</html>
